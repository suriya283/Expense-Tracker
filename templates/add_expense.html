<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add expense</title>
    <link rel="stylesheet" href="{{url_for('static', filename='add_expense.css')}}">
<!--        <link rel="stylesheet" href="../static/add_expense.css">-->
</head>
<body>
    <h2>Add expense</h2>
    <form class="addForm" action="#">
        <div class="row">
            <label for="date">Date:</label>
            <input type="date" id="date" name="Date" required>
        </div>
        <div class="row">
            <label for="time">Time:</label>
            <input type="time" id="time" name="time" required>
        </div>
        <div class="row">
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" placeholder="Enter your category" required>
        </div>
        <div class="row">   
            <label for="expense">Expense:</label>
            <input type="number" id="expense" name="expense" placeholder="Enter your expense" required>
        </div>
            <button>Submit</button>
    </form>
</body>
</html>
