<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='update_expense.css') }}">
{#    <link rel="stylesheet" href="../static/update_expense.css">#}
</head>
<body>
    <h2>UPDATE EXPENSE</h2>
    <form class="update"  method = "POST" action="/update/{{ id }}">
        <div class="row">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="row">
            <label for="time">Time</label>
            <input type="time" id="time" name="time" required>
        </div>
        <div class="row">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="Enter the category">
        </div>
        <div class="row">
            <label for="expense">Expense</label>
            <input type="number" id="expense" name="expense" placeholder="Enter an amount">
        </div>
        <button type="reset">Reset</button>
        <button onclick="window.location.href='{{ url_for('view') }}'" type="button">Go Back</button>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
